[project]
name = "pipeline"
version = "0.1.0"
# 3.11: the eval bundle's Modal image (python:3.11-slim) imports this code from the workspace.
requires-python = ">=3.11,<3.12"
dependencies = [
    "joblib>=1.6.0,<2",
    "numpy>=2.4.6,<3",
    "pandas>=3.0.6,<4",
    "scikit-learn>=1.9.1,<2",
    # The CPU-only build: plain `xgboost` pulls the CUDA wheels (nvidia-nccl-cu12).
    "xgboost-cpu>=3.2.0,<4",
]

[dependency-groups]
# What the test image installs (and nothing else): xgboost and scikit-learn are stubbed in the tests.
test = [
    "joblib>=1.6.0,<2",
    "mypy>=2.4.0,<3",
    "numpy>=2.4.6,<3",
    "pandas>=3.0.6,<4",
    "pandas-stubs>=3.0.5,<4",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.1,<0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Not installed in the test image (stubbed in the tests) and untyped.
module = ["xgboost", "xgboost.*", "sklearn", "sklearn.*", "joblib"]
ignore_missing_imports = true
